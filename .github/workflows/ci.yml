name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Public repo: self-hosted runners must never execute untrusted fork-PR code.
# Every job below is gated so it runs only for pushes, workflow_dispatch, and
# same-repo pull requests — fork PRs are skipped (they would otherwise run on
# the fleet runner). See CI EXODUS runbook §3.

jobs:
  lint:
    name: Lint shell and python
    runs-on: [self-hosted, qa]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # shellcheck + ruff are installed system-wide on the fleet runner.
      - name: Run shellcheck on all .sh files
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | \
            xargs -0 -r shellcheck --severity=warning --shell=bash

      # skills/ was extracted to AQaddora/pure-skill-suite (commit 47e347f); this
      # repo currently ships no Python, so ruff lints the whole tree and passes
      # cleanly while staying meaningful if Python returns.
      - name: Run ruff
        run: ruff check .

  structure:
    name: Verify repo structure
    runs-on: [self-hosted, qa]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Expected top-level directories present
        run: |
          for dir in sessions templates tools docs; do
            if [[ ! -d "$dir" ]]; then
              echo "Missing expected directory: $dir"
              exit 1
            fi
          done
          echo "Top-level structure OK."

      - name: Verify no private session files committed
        run: |
          if find sessions -path '*/private/*' ! -name '.gitkeep' ! -name 'README.md' -type f | grep -q .; then
            echo "Found private session files in tracked content:"
            find sessions -path '*/private/*' ! -name '.gitkeep' ! -name 'README.md' -type f
            exit 1
          fi
          echo "No private session files tracked."
